services:
  postgres:
    image: postgres:17-alpine
    container_name: payment-orchestrator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_orchestrator
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      # 5432/5433 are taken by the Homebrew postgres@17 instances on this machine
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

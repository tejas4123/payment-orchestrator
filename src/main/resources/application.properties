spring.application.name=payment-orchestrator

# --- Datasource -------------------------------------------------------------
# Backed by the Postgres container in compose.yaml (host port 5434).
# Every value can be overridden by an env var for other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/payment_orchestrator}
spring.datasource.username=${DB_USER:payment}
spring.datasource.password=${DB_PASSWORD:payment}

# --- JPA / Hibernate --------------------------------------------------------
# 'update' is convenient while the schema is still forming. Switch to
# 'validate' and manage schema with Flyway/Liquibase before this goes anywhere real.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
